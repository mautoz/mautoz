# Atualiza o README com os últimos filmes do Letterboxd.
name: Latest posts

on:
  schedule:
    - cron: "0 */12 * * *"  # a cada 12 horas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Letterboxd
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://letterboxd.com/mauricioozaki/rss/"
          comment_tag_name: "LETTERBOXD"
          max_post_count: 3
